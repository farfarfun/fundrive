name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        # 刻意只装核心依赖 + dev 组，不装任何可选 SDK（不传 --extra）：
        # 测试必须能在裸环境下抓出驱动注册表的类名拼写错误。
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        # 没收集到用例时 pytest 返回 5，CI 会失败，避免"空跑的绿灯"
        run: uv run pytest -v

      - name: Import smoke test (bare env, read-only-ish cwd)
        run: |
          PY="$PWD/.venv/bin/python"
          cd "$(mktemp -d)"
          "$PY" -c "
          import fundrive
          n = len(fundrive.get_supported_drives())
          assert n >= 25, f'注册表只剩 {n} 个驱动，可能有 spec 被漏掉'
          print(f'OK: {n} 个驱动已注册, 本机可用 {len(fundrive.list_available_drives())} 个')
          "

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build wheel & sdist
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
