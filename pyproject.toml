[project]
name = "fundrive"
version = "2.0.91"
description = "fundrive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "orjson>=3.10.10",
 "requests>=2.32.4",
 "tqdm>=4.67.1",
 "urllib3>=2.0",
 "funsecret>=1.4.96",
 "farlog>=1.1.8",
 "funget>=1.1.69",
]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[dependency-groups]
dev = [ "pytest>=8.0", "ruff>=0.6",]
all = [ "fundrive[oss]", "fundrive[alipan]", "fundrive[webdav]", "fundrive[baidu]", "fundrive[lanzou]", "fundrive[google]", "fundrive[onedrive]", "fundrive[wenshushu]", "fundrive[amazon]", "fundrive[tsinghua]", "fundrive[dropbox]", "fundrive[github]", "fundrive[gitee]", "fundrive[ossutil]", "fundrive[pan115]",]

[project.optional-dependencies]
# `all` 是自引用 extra（PEP 621 允许），让 `uv add "fundrive[all]"` 能一次装齐全部驱动；
# 上面 [dependency-groups] 的同名组只对本仓库开发者生效，发布到 PyPI 的元数据里没有它。
all = [ "fundrive[oss]", "fundrive[alipan]", "fundrive[webdav]", "fundrive[baidu]", "fundrive[lanzou]", "fundrive[google]", "fundrive[onedrive]", "fundrive[wenshushu]", "fundrive[amazon]", "fundrive[tsinghua]", "fundrive[dropbox]", "fundrive[github]", "fundrive[gitee]", "fundrive[ossutil]", "fundrive[pan115]",]
alipan = [ "aligo>=6.2.4", "fundrive-alipan>=1.3.13",]
oss = [ "oss2>=2.19.0",]
webdav = [ "webdav4>=0.10.0",]
wenshushu = [ "base58>=2.1.1", "pycryptodomex>=3.21.0",]
baidu = [ "fundrive-baidu>=1.0.10",]
lanzou = [ "fundrive-lanzou>=1.2.73", "funfile>=1.0.39",]
dropbox = [ "dropbox>=12.0.2",]
google = [ "google-api-python-client>=2.0.0", "google-auth>=2.0.0", "google-auth-httplib2>=0.1.0", "google-auth-oauthlib>=1.0.0",]
amazon = [ "boto3>=1.34.0", "botocore>=1.34.0",]
ossutil = [ "funinstall>=1.0.58",]
pan115 = [ "p115client>=0.0.9.6.5.1", "funfile>=1.0.39",]
pcloud = []
github = []
gitee = []
onedrive = []
tsinghua = []
mediafire = []
zenodo = []
openxlab = []
tianchi = []

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundrive"
Releases = "https://github.com/farfarfun/fundrive/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrive"]

[tool.ruff]
src = [ "src",]
target-version = "py312"
extend-exclude = [ "*.md",]

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "PLE", "T100", "S102",]
ignore = [
    "E501",
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]

[tool.pytest.ini_options]
testpaths = [ "tests",]
pythonpath = [ "src",]
addopts = "-q --strict-markers"

[tool.ruff.lint.per-file-ignores]
"src/fundrive/drives/*/example.py" = [ "T201",]
